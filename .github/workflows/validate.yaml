name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  # Only a PR's superseded runs; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared Repo Tooling: reusable workflows from the Repo Tooling repo, pinned by commit; Renovate bumps them
# together (repo-ci-vX.Y.Z). Each installs its tool from its own commit.
jobs:
  tool-tests:
    name: tool tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install --quiet --requirement tools/requirements-test.txt
      - run: python3 -m pytest tools

  # tools/validate/args: every input as an explicit --path; tools/validate/privacy-allow: the load-bearing
  # identifiers the privacy check allows in prose.
  validate-args:
    name: validate args
    runs-on: ubuntu-24.04
    outputs:
      args: ${{ steps.args.outputs.args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tools/validate/args
            tools/validate/privacy-allow
            tools/validate/validate_args.py
          sparse-checkout-cone-mode: false
      # validate_args.py refuses a malformed line and shell-quotes the rest for repo-validate's shlex.split.
      - id: args
        run: |
          args=$(python3 tools/validate/validate_args.py)
          echo "args=$args" >> "$GITHUB_OUTPUT"

  # privacy reads its denylist from the PRIVACY_DENYLIST secret, never committed. Fork PRs get no secrets, so there
  # it skips; every other run fails on a match.
  repo:
    name: secrets, env, compose, cloudflare, isolation, privacy
    needs: validate-args
    uses: jbruns/homelab-components/.github/workflows/repo-validate.yaml@b59b24fbb343d5838f90eb8abd7f943488e0846c # repo-ci-v1.1.0
    with:
      checks: secrets env compose cloudflare isolation privacy
      extra-args: ${{ needs.validate-args.outputs.args }}
      privacy-mode: fail
    secrets:
      privacy-denylist: ${{ secrets.PRIVACY_DENYLIST }}

  monitoring:
    name: monitoring configs, rules, dashboards, Grafana
    needs: validate-args
    uses: jbruns/homelab-components/.github/workflows/repo-validate.yaml@b59b24fbb343d5838f90eb8abd7f943488e0846c # repo-ci-v1.1.0
    with:
      checks: monitoring
      timeout-minutes: 10
      extra-args: ${{ needs.validate-args.outputs.args }}

  declared-containers:
    name: declared containers
    uses: jbruns/homelab-components/.github/workflows/repo-declared-containers.yaml@b59b24fbb343d5838f90eb8abd7f943488e0846c # repo-ci-v1.1.0

  # The one-time full-history scan ran before adoption (#308: 597 commits, no leaks).
  gitleaks:
    name: gitleaks
    uses: jbruns/homelab-components/.github/workflows/repo-gitleaks.yaml@b59b24fbb343d5838f90eb8abd7f943488e0846c # repo-ci-v1.1.0

  tooling:
    name: renovate config, actionlint
    uses: jbruns/homelab-components/.github/workflows/repo-lint.yaml@b59b24fbb343d5838f90eb8abd7f943488e0846c # repo-ci-v1.1.0

  # The single required check on main: fails unless every job above succeeded.
  validate:
    name: validate
    if: always()
    needs: [tool-tests, validate-args, repo, monitoring, declared-containers, gitleaks, tooling]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::a needed job ended $result: $RESULTS"
              exit 1
            fi
          done
          echo "all checks passed"
