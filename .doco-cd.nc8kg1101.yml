# yaml-language-server: $schema=https://doco.cd/v0.128/schemas/deploy.schema.json
# The Host's doco-cd reads only this file: its POLL_CONFIG sets `target` to the Host's name, and doco-cd
# then looks for .doco-cd.<target>.yml at the repo root. Another Host's doco-cd sets its own target
# and reads its own file, so no Host ever deploys another Host's folder.
#
# doco-cd deploys every Stack it finds at <stack root>/<stack>/compose.yaml; the folder name is the
# Compose project name. delete only removes projects doco-cd itself labelled, so it never touches a
# container started by hand or by another tool.
#
# Removing a Stack folder removes that Stack from the Host; its volumes are kept.
working_dir: nc8kg1101
compose_files:
  - compose.yaml
env_files:
  - .sops.env
remove_orphans: true
timeout: 600
auto_discovery:
  enabled: true
  depth: 1
  delete: true
  remove_volumes: false
  remove_images: true
