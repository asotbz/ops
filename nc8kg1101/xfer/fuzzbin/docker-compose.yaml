services:
  fuzzbin:
    # https://github.com/asotbz/Fuzzbin
    image: ghcr.io/asotbz/fuzzbin:0.5.0
    security_opt:
      - no-new-privileges=true
    container_name: fuzzbin
    restart: unless-stopped
    labels:
      # Alert Tier (asotbz/ops#302): critical | warning | info
      tier: warning
      stack-back.volumes: true
      stack-back.volumes.include: "fuzzbin_config"

    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 1
        tag: "{{.Name}}"
    volumes:
      - fuzzbin_config:/config
      - /var/media/music_videos:/music_videos
    network_mode: service:gluetun
    
volumes:
  fuzzbin_config:
