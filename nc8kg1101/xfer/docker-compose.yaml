# XFER STACK
## Per-stack instances of services are declared here.

# When referring to a network called 'backend', we mean the common stack's backend network
networks:
  backend:
    name: common_backend
    external: true
  # Traefik and the Services it routes to; owned by the edge Stack (ADR 0002)
  proxy:
    name: proxy
    external: true
  # mitmproxy and the Services that send requests through it; owned by the edge Stack (ADR 0002)
  forward-proxy:
    name: forward-proxy
    external: true
  # Prometheus and the exporters it scrapes; owned by the monitoring Stack (ADR 0002)
  metrics:
    name: metrics
    external: true

# Remaining services in the stack have their own Compose configuration. 
include:
  - ./dispatcharr/docker-compose.yaml
  - ./ersatztv/docker-compose.yaml
  - ./fuzzbin/docker-compose.yaml
  - ./gluetun/docker-compose.yaml
  - ./nzbhydra2/docker-compose.yaml
  - ./nzbhydra2-exporter/docker-compose.yaml
  - ./prowlarr/docker-compose.yaml

