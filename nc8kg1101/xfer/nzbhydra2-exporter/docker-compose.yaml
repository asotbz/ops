services:
  nzbhydra2-exporter:
    # Indexer health for Prometheus; see nzbhydra2_exporter.py.
    # https://hub.docker.com/_/python
    image: python:3.14.8-alpine3.24
    container_name: nzbhydra2-exporter
    restart: unless-stopped
    user: 65534:65534
    security_opt:
      - no-new-privileges=true
    command: ["python3", "-u", "/app/nzbhydra2_exporter.py"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9811/metrics"]
      interval: 60s
      timeout: 25s
      retries: 3
      start_period: 30s
    environment:
      - NZBHYDRA_URL=http://nzbhydra2:5076
      - NZBHYDRA_API_KEY=${NZBHYDRA_API_KEY}
    depends_on:
      - nzbhydra2
    labels:
      # logs collection
      logging: promtail
      logging_jobname: containerlogs
      stackname: xfer
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 1
        tag: "{{.Name}}"
    volumes:
      - ./nzbhydra2_exporter.py:/app/nzbhydra2_exporter.py:ro
    networks:
      - backend
