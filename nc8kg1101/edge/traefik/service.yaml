# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  traefik:
    extends:
      file: ../../_baseline.yaml
      service: baseline
    # https://hub.docker.com/_/traefik
    image: traefik:v3.7.15@sha256:0f6150202bc1fed72a7bd2107460eaa510e5b8a905f3fdb5b84f2c8619c33368
    container_name: traefik
    user: ${COMMON_UID}:${COMMON_GID}
    group_add:
      - ${DOCKER_GID}
    deploy:
      resources:
        limits:
          # 114M working set at cutover
          memory: 384M
    depends_on:
      crowdsec:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8082/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    command:
      # Debug-level logging as necessary
      # - --log.level=DEBUG

      # Enable access logs, also read by Crowdsec
      - --accesslog=true
      - --accesslog.filepath=/var/log/traefik/access.log

      # Enable API for Dashboard
      - --api=true

      # Enable Docker support and only proxy containers that are explicitly declared
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Reach every routed Service over the proxy network, whichever other networks it is on
      - --providers.docker.network=proxy

      # Entrypoints
      - --entrypoints.https.address=:443
      - --entrypoints.http.address=:80
      # Trust X-Forwarded-For only from Cloudflare's edge, so access logs (CrowdSec) and the
      # bouncer see the real client instead of a Cloudflare IP. All three lists must match
      # (homelab-validate cloudflare).
      - --entrypoints.https.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      - --entrypoints.http.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      - --entrypoints.metrics.address=:8082
      # The healthcheck's endpoint; :8082 is not published
      - --ping=true
      - --ping.entryPoint=metrics

      # Let's Encrypt/ACME configuration
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.email=${EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json

      # Prometheus metrics
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics

      # Enable Crowdsec bouncer plugin - https://plugins.traefik.io/plugins/6335346ca4caa9ddeffda116/crowdsec-bouncer-traefik-plugin
      - --experimental.plugins.crowdsec-bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      - --experimental.plugins.crowdsec-bouncer.version=v1.5.1
    environment:
      # Provide Cloudflare secret for DNS01 validation
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "0"
      stack-back.volumes: true
      stack-back.volumes.include: "traefik_le"

      # Traefik Dashboard
      traefik.enable: true

      # Listen on http, but redirect all requests to https
      traefik.http.routers.traefik-http.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.traefik-http.entrypoints: http
      traefik.http.routers.traefik-http.middlewares: redirect-https

      # Direct https requests to internal API, protecting with basic auth and crowdsec
      traefik.http.routers.traefik-https.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.traefik-https.entrypoints: https
      traefik.http.routers.traefik-https.tls: true
      traefik.http.routers.traefik-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.traefik-https.service: api@internal
      traefik.http.routers.traefik-https.middlewares: traefik-dashboard

      # Probe (GLOSSARY.md): the public path a user takes; see monitoring/prometheus/prometheus.yml
      probe.url: https://traefik.${DOMAIN}/
      probe.module: http_auth

      traefik.http.middlewares.traefik-auth.basicauth.users: ${TRAEFIK_USER}:${TRAEFIK_PASSWORD_HASH}
      traefik.http.middlewares.traefik-dashboard.chain.middlewares: crowdsec-bouncer,traefik-auth

      # Default TLS certificate
      traefik.tls.stores.default.defaultgeneratedcert.resolver: ${CERT_RESOLVER}
      traefik.tls.stores.default.defaultgeneratedcert.domain.main: ${DOMAIN}

      # Enable strict SNI checking
      traefik.tls.options.default.sniStrict: true

      # Common middleware configuration, used by routed Services in every Stack
      ## Crowdsec bouncer
      traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.enabled: true
      ## Debug logging as necessary
      # traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.loglevel: DEBUG
      traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdseclapikey: ${TRAEFIK_BOUNCER_API_KEY}
      # Same Cloudflare ranges as the entrypoints' forwardedHeaders.trustedIPs
      traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.forwardedHeadersTrustedIPs: 173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32

      # Appsec
      traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecAppsecEnabled: true
      traefik.http.middlewares.crowdsec-bouncer.plugin.crowdsec-bouncer.crowdsecAppsecHost: crowdsec:7422

      ## Redirect to HTTPS
      traefik.http.middlewares.redirect-https.redirectScheme.scheme: https

      ## On every router that skips forward auth (ADR 0005): removes the identity headers the IdP's
      ## forward auth would hand a Service, so a client can never supply them itself. An empty value
      ## removes the header.
      traefik.http.middlewares.strip-idp-headers.headers.customRequestHeaders.X-authentik-username: ""
      traefik.http.middlewares.strip-idp-headers.headers.customRequestHeaders.X-authentik-groups: ""
      traefik.http.middlewares.strip-idp-headers.headers.customRequestHeaders.X-authentik-entitlements: ""
      traefik.http.middlewares.strip-idp-headers.headers.customRequestHeaders.X-authentik-email: ""
      traefik.http.middlewares.strip-idp-headers.headers.customRequestHeaders.X-authentik-name: ""
      traefik.http.middlewares.strip-idp-headers.headers.customRequestHeaders.X-authentik-uid: ""
      traefik.http.middlewares.strip-idp-headers.headers.customRequestHeaders.X-authentik-jwt: ""
      traefik.http.middlewares.strip-idp-headers.headers.customRequestHeaders.X-authentik-meta-jwks: ""
      traefik.http.middlewares.strip-idp-headers.headers.customRequestHeaders.X-authentik-meta-outpost: ""
      traefik.http.middlewares.strip-idp-headers.headers.customRequestHeaders.X-authentik-meta-provider: ""
      traefik.http.middlewares.strip-idp-headers.headers.customRequestHeaders.X-authentik-meta-app: ""
      traefik.http.middlewares.strip-idp-headers.headers.customRequestHeaders.X-authentik-meta-version: ""
      ## Per client, on Client Paths (ADR 0005), which skip the IdP's check. depth 1 is the address
      ## the entrypoint's forwarded headers end with: the client's.
      traefik.http.middlewares.client-ratelimit.ratelimit.average: 30
      traefik.http.middlewares.client-ratelimit.ratelimit.burst: 120
      traefik.http.middlewares.client-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth: 1
    ports:
      - 443:443
      - 80:80
    volumes:
      # Access log
      - traefik_log:/var/log/traefik
      # ACME/TLS configuration
      - traefik_le:/letsencrypt
      # Plugins storage
      - traefik_plugins-storage:/plugins-storage
      # Allow Traefik to get updates from the Docker engine
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # CrowdSec LAPI and AppSec
      default: {}
      proxy:
        # Static, so Exposed Services can trust exactly this proxy. Also in mitmproxy/openresty/nginx.conf
        # (set_real_ip_from) and outside the ip_range in compose.yaml; change them together.
        ipv4_address: 172.30.0.10
      # Prometheus scrapes traefik:8082
      metrics: {}

volumes:
  # Moved from common_traefik_* at the cutover (asotbz/ops#301, ADR 0009).
  # Read by CrowdSec too.
  traefik_log:
    name: edge_traefik_log
    external: true
  traefik_le:
    name: edge_traefik_le
    external: true
  # Traefik re-downloads its contents, but not regenerable: the image has no /plugins-storage, so a
  # volume Compose created would be root-owned and Traefik (non-root) could not write to it.
  traefik_plugins-storage:
    name: edge_traefik_plugins-storage
    external: true
