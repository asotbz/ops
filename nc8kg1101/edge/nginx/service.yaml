# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  nginx:
    extends:
      file: ../../_baseline.yaml
      service: baseline
    # https://hub.docker.com/r/nginxinc/nginx-unprivileged
    image: nginxinc/nginx-unprivileged:1.31.7@sha256:09b0d3eda2aa592d2487f284519419015cab010d7df16cd0fe224b585fc60eb6
    container_name: nginx
    user: ${COMMON_UID}:${COMMON_GID}
    deploy:
      resources:
        limits:
          # 9M working set at cutover
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "0"
      # Legacy log collection (monitoring's promtail) until monitoring is cut over.
      logging: promtail
      logging_jobname: containerlogs
      stackname: edge

      traefik.enable: true

      # Catch-all for any undefined hostname. Handle error pages.
      traefik.http.routers.nginx-http.rule: HostRegexp(`.+`)
      traefik.http.routers.nginx-http.priority: 1
      traefik.http.routers.nginx-http.entrypoints: http
      traefik.http.routers.nginx-http.service: nginx
      traefik.http.routers.nginx-http.middlewares: catch-all

      # Catch-all over HTTPS
      traefik.http.routers.nginx-https.rule: HostRegexp(`.+`)
      traefik.http.routers.nginx-https.priority: 1
      traefik.http.routers.nginx-https.entrypoints: https
      traefik.http.routers.nginx-https.tls: true
      traefik.http.routers.nginx-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.nginx-https.service: nginx
      traefik.http.routers.nginx-https.middlewares: catch-all

      # Probe (GLOSSARY.md): the public path a user takes. Unused until monitoring is cut over.
      probe.url: https://${DOMAIN}/

      traefik.http.services.nginx.loadbalancer.server.port: 80

      # Middleware to send HTTP errors to nginx
      traefik.http.middlewares.error-pages.errors.status: 400-599
      traefik.http.middlewares.error-pages.errors.query: /{status}.html
      traefik.http.middlewares.error-pages.errors.service: nginx

      # Chain the catch-all middlewares together
      traefik.http.middlewares.catch-all.chain.middlewares: crowdsec-bouncer,error-pages
    # Everything comes from doco-cd's checkout of this repo. Directories, not single files: a file
    # bind mount keeps the old inode when a Deploy replaces the file.
    volumes:
      # Friendly error page html, and the snippets default.conf includes
      - ./error-pages:/srv/http/default:ro
      # Simple configuration to handle errors
      - ./conf.d:/etc/nginx/conf.d:ro
    networks:
      - default
      - proxy
