# DEPENDENCIES (GLOSSARY.md): one Dependency Probe per edge, dependent -> Dependency, for a
# Dependency that no Probe of an Exposed Service already covers. None yet on the Host.
# A template: dependencies-render fills in each $$NAME placeholder from its environment (service.yaml) and
# writes the file Prometheus reads as file_sd (job `dependency` in prometheus.yml). A new placeholder
# must also be added to that environment (homelab-validate env checks it); write a literal dollar sign
# as two. Each entry probes the exact URL the dependent uses:
#
# - targets: ['<URL>']
#   labels: {from: <dependent>, to: <Dependency>, kind: internal|external, tier: <highest Tier of its
#            dependents>, stack: <where DependencyDown groups>, prober: 'blackbox-exporter:9115',
#            module: <blackbox.yml module>, container: <internal only: the Dependency's container>}
#
# Adding the first one also adds DependencyDown and DependencyProbesMissing (alerting-rules.yml),
# their inhibitions (alertmanager/config.yml) and tests.
[]
