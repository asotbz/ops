# Modules a Service picks with its `probe.module` label (default http_2xx), and that a
# Dependency Probe names in `module` (prometheus/dependencies.yml).
# Every module dials IPv4: Docker's networks here have no IPv6, and blackbox prefers ip6 by
# default, so any target with an AAAA record (Cloudflare, Google) would fail to connect.
modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []  # 2xx

  # Edge reachability only: a 401 shows the router and its basic-auth middleware answer, not that
  # anything behind them is up. Only traefik uses it, where that middleware is the probed Service.
  http_auth:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [401]

  # Through the basic-auth wall to the Service itself, as the machine user `prometheus` (a Compose
  # secret, service.yaml): a 2xx means the Service answered. Prometheus's web.yml and Loki's Traefik
  # middleware both accept that user.
  http_prometheus_auth:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []  # 2xx
      basic_auth:
        username: prometheus
        password_file: /run/secrets/prometheus_password

  # Denies anonymous requests by design (mitmproxy's web UI, openresty's `location /`): a 403 from
  # the Service itself means it is up; Traefik answers 502 or 404 when it is not.
  http_403:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [403]

  # A Protected Service's `probe.idp_url` (job probe-idp): its login path answers an anonymous
  # request by redirecting to the IdP's authorize endpoint. Not followed, so the IdP is never touched.
  # blackbox searches the header unanchored, so the regexp anchors the IdP's exact origin and path
  # (tools/monitoring/tests/test_blackbox_idp_redirect.py). Monitoring checks the IdP itself, so it may
  # name its address and path; ADR 0005 keeps that out of Services. Change both with the IdP.
  http_idp_redirect:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [302]
      fail_if_header_not_matches:
        - header: Location
          regexp: '^https://idp\.asot\.bz/application/o/authorize/(\?|$)'

  tcp_connect:
    prober: tcp
    timeout: 8s
    tcp:
      preferred_ip_protocol: ip4
