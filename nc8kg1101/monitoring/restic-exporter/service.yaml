# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  restic-exporter:
    # https://github.com/ngosang/restic-exporter
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ngosang/restic-exporter:2.1.2@sha256:a8f9cfa3016237c7008aefa4d9c6639bc9b34d2582eed07ac58dcf56632e4170
    container_name: restic-exporter
    deploy:
      resources:
        limits:
          # Initial allowance for restic's repository index; revisit after 30 days.
          memory: 1792M
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8001/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    # Repository and password from stack-back, but a separate read-only B2 key.
    env_file: ./b2.sops.env
    environment:
      REFRESH_INTERVAL: "3600"
      INCLUDE_PATHS: "true"
      # stack-back already checks after every Backup; this reader must not repeat it.
      NO_CHECK: "true"
    labels:
      tier: warning
      startup-order: "3"
    volumes:
      - restic-exporter_cache:/root/.cache/restic
    networks:
      - default

volumes:
  restic-exporter_cache:
    name: monitoring_restic-exporter_cache
    labels:
      homeops.regenerable: "restic rebuilds its cache from the repository"
