# AUTHENTIK STACK (deployed by doco-cd)
# The IdP (GLOSSARY.md, ADR 0005): Authentik's server and worker, and the Postgres Datastore they share.
# Authentik has needed no Redis since 2025.10 (cache, tasks and websockets moved to Postgres), so
# this Stack has none. Every Service extends the Baseline (../_baseline.yaml).

# The server, worker and Postgres talk on the Stack's default network, authentik_default.
networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack (ADR 0002).
  proxy:
    name: proxy
    external: true
  # stack-back and the databases it dumps; owned by the ops Stack (ADR 0002).
  backup:
    name: backup
    external: true

include:
  - ./authentik/service.yaml
  - ./postgres/service.yaml
