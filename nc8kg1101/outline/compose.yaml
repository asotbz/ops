# OUTLINE STACK (deployed by doco-cd)
# The Outline wiki and its Datastores, Postgres and Redis. Every Service extends the Baseline
# (../_baseline.yaml).

# Outline and its Datastores talk on the Stack's default network, outline_default.
networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack (ADR 0002).
  proxy:
    name: proxy
    external: true
  # stack-back and the databases it dumps; owned by the ops Stack (ADR 0002).
  backup:
    name: backup
    external: true

include:
  - ./outline/service.yaml
  - ./postgres/service.yaml
  - ./redis/service.yaml
