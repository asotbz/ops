# COMMON (legacy group; started by hand with `docker compose`, not by Portainer or doco-cd)
# Only the Portainer agent is left: Traefik, CrowdSec and nginx moved to the edge Stack (asotbz/ops#301)
# and the agent goes with asotbz/ops#305. The backend network (common_backend) stays until the last
# legacy Stack using it is cut over (ADR 0002).
networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: ${COMMON_BACKEND_SUBNET_V4}

include:
  - ./portainer/docker-compose.yaml
