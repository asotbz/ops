# FUZZBIN STACK (deployed by doco-cd)
# Fuzzbin, the Requester, Downloader and Organizer of the Music Videos Library (GLOSSARY.md), and
# gluetun, the sidecar whose VPN tunnel Fuzzbin's traffic leaves through. Fuzzbin shares gluetun's
# network namespace, so gluetun holds Fuzzbin's networks. Every Service extends the Baseline
# (../_baseline.yaml).

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack (ADR 0002).
  proxy:
    name: proxy
    external: true

include:
  - ./fuzzbin/service.yaml
  - ./gluetun/service.yaml
