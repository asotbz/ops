# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  gluetun:
    # https://github.com/qdm12/gluetun
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    # Runs as root: it sets up the tunnel, routes and firewall for the namespace Fuzzbin shares.
    # NET_ADMIN for the WireGuard interface, routes and iptables; NET_RAW for iptables' raw socket
    # and the ICMP echo of its health check.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    deploy:
      resources:
        limits:
          # 7-day peak under Portainer: 217MiB (#304). Above the Baseline's 1.5x until a 30-day peak
          # exists to size it by.
          memory: 384M
    healthcheck:
      # As the image's own HEALTHCHECK: healthy while the tunnel answers.
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      - HTTP_CONTROL_SERVER_ADDRESS=:8001
      - VPN_SERVICE_PROVIDER=${GLUETUN_PROVIDER}
      - VPN_TYPE=${GLUETUN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${GLUETUN_WG_PRIVATE_KEY}
      - SERVER_COUNTRIES=${GLUETUN_COUNTRIES}
      - SERVER_CITIES=${GLUETUN_CITIES}
      # gluetun writes its public IP to a file and chowns it to PUID:PGID. Without DAC_OVERRIDE it cannot
      # write into the image's /tmp/gluetun (created 0644), and without CHOWN it cannot hand the file to
      # 1000, so keep the file in /tmp and owned by root.
      - PUBLICIP_FILE=/tmp/gluetun-ip
      - PUID=0
      - PGID=0
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      # Fuzzbin's routers and Probe, on the container that holds its network namespace: Prometheus'
      # docker_sd finds no target for a container in another's namespace, and homelab-validate
      # wants a router's Probe on the same Service. Hence the gluetun-* router names.
      traefik.enable: true

      # Listen on http, but redirect all requests to https
      traefik.http.routers.gluetun-http.rule: Host(`fzb.${DOMAIN}`)
      traefik.http.routers.gluetun-http.entrypoints: http
      traefik.http.routers.gluetun-http.middlewares: redirect-https

      # Direct all https requests to Fuzzbin, checking with crowdsec first
      traefik.http.routers.gluetun-https.rule: Host(`fzb.${DOMAIN}`)
      traefik.http.routers.gluetun-https.entrypoints: https
      traefik.http.routers.gluetun-https.tls: true
      traefik.http.routers.gluetun-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.gluetun-https.service: gluetun
      traefik.http.routers.gluetun-https.middlewares: crowdsec-bouncer

      # Fuzzbin's port; gluetun's own control server (:8001) is not routed.
      traefik.http.services.gluetun.loadbalancer.server.port: 8000

      # Probe (GLOSSARY.md): the public path a user takes; see monitoring/prometheus/prometheus.yml.
      # ProbeFailed names gluetun, whose tunnel being down is the likelier cause anyway.
      probe.url: https://fzb.${DOMAIN}/health
    networks:
      - default
      # Routed by edge's Traefik (ADR 0002), for Fuzzbin in its network namespace
      - proxy
