services:
  authentik-proxy:
    image: ghcr.io/goauthentik/proxy:2026.5.5
    container_name: authentik-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    environment:
      AUTHENTIK_HOST: https://idp.${DOMAIN}
      AUTHENTIK_INSECURE: "false"
      AUTHENTIK_TOKEN: ${AUTHENTIK_TOKEN}
    labels:
      # Boot order, see jbruns/home-ops ADR-0003 (0 edge, 1 dependencies, 2 Exposed Services, 3 sidecars)
      startup-order: "1"
      # Monitoring: Uptime is the image's own health check, see jbruns/home-ops GLOSSARY.md
      tier: warning
      traefik.enable: true
      traefik.docker.network: proxy
      
      ## Authentik forward auth middleware
      traefik.http.middlewares.authentik.forwardAuth.address: "http://authentik-proxy:9000/outpost.goauthentik.io/auth/traefik"
      traefik.http.middlewares.authentik.forwardAuth.trustForwardHeader: true
      traefik.http.middlewares.authentik.forwardAuth.authResponseHeaders: "X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - default
      - proxy
