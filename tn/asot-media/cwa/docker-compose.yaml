services:
  calibre-web-automated:
    # https://github.com/crocodilestick/Calibre-Web-Automated
    # https://hub.docker.com/r/crocodilestick/calibre-web-automated/tags
    image: crocodilestick/calibre-web-automated:v4.0.8
    container_name: calibre-web-automated
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped
    environment:
      - PUID=${BOOKS_UID}
      - PGID=${MEDIA_SHARED_GID}
      - TZ=${TZ}
    labels:
      # Boot order, see jbruns/home-ops ADR-0003 (0 edge, 1 dependencies, 2 Exposed Services, 3 sidecars)
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "calibre-web-automated_config"

      # Monitoring: Tier and Probes, see jbruns/home-ops GLOSSARY.md (Probe, Uptime)
      tier: warning
      probe.url: https://cwa.${DOMAIN}/health
      probe.idp_url: https://cwa.${DOMAIN}/

      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.cwa-http.rule: Host(`cwa.${DOMAIN}`)
      traefik.http.routers.cwa-http.entrypoints: http
      traefik.http.routers.cwa-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.cwa-opds.rule: Host(`cwa.${DOMAIN}`) && PathPrefix(`/opds`)
      traefik.http.routers.cwa-opds.entrypoints: https
      traefik.http.routers.cwa-opds.tls: true
      traefik.http.routers.cwa-opds.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.cwa-opds.service: cwa
      traefik.http.routers.cwa-opds.middlewares: crowdsec-bouncer

      # Unauthenticated health path for the Probe; everything else stays behind Authentik
      traefik.http.routers.cwa-health.rule: Host(`cwa.${DOMAIN}`) && Path(`/health`)
      traefik.http.routers.cwa-health.entrypoints: https
      traefik.http.routers.cwa-health.tls: true
      traefik.http.routers.cwa-health.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.cwa-health.service: cwa
      traefik.http.routers.cwa-health.middlewares: crowdsec-bouncer
      
      traefik.http.routers.cwa-https.rule: Host(`cwa.${DOMAIN}`)
      traefik.http.routers.cwa-https.entrypoints: https
      traefik.http.routers.cwa-https.tls: true
      traefik.http.routers.cwa-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.cwa-https.service: cwa
      traefik.http.routers.cwa-https.middlewares: cwa-chain

      traefik.http.services.cwa.loadbalancer.server.port: 8083

      traefik.http.middlewares.cwa-chain.chain.middlewares: crowdsec-bouncer,authentik
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"
    volumes:
      - calibre-web-automated_config:/config
      - ${ZFS_POOL_ROOT_HDD}/media/cwa-book-ingest:/cwa-book-ingest
      - ${ZFS_POOL_ROOT_HDD}/media/books:/calibre-library
    networks:
      - default
      - proxy

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:v1.4.0
    container_name: shelfmark
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped
    environment:
      - UID=${BOOKS_UID}
      - GID=${MEDIA_SHARED_GID}
      - TZ=${TZ}
      - AA_DONATOR_KEY=${AA_DONATOR_KEY}
    labels:
      # Boot order, see jbruns/home-ops ADR-0003 (0 edge, 1 dependencies, 2 Exposed Services, 3 sidecars)
      startup-order: "2"
      # Monitoring: Tier and Probes, see jbruns/home-ops GLOSSARY.md (Probe, Uptime)
      tier: warning
      probe.url: https://cwd.${DOMAIN}/api/health
      probe.idp_url: https://cwd.${DOMAIN}/

      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.shelfmark-http.rule: Host(`cwd.${DOMAIN}`)
      traefik.http.routers.shelfmark-http.entrypoints: http
      traefik.http.routers.shelfmark-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.shelfmark-https.rule: Host(`cwd.${DOMAIN}`)
      traefik.http.routers.shelfmark-https.entrypoints: https
      traefik.http.routers.shelfmark-https.tls: true
      traefik.http.routers.shelfmark-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.shelfmark-https.service: shelfmark
      traefik.http.routers.shelfmark-https.middlewares: shelfmark-chain

      # Unauthenticated health path for the Probe; everything else stays behind Authentik
      traefik.http.routers.shelfmark-health.rule: Host(`cwd.${DOMAIN}`) && Path(`/api/health`)
      traefik.http.routers.shelfmark-health.entrypoints: https
      traefik.http.routers.shelfmark-health.tls: true
      traefik.http.routers.shelfmark-health.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.shelfmark-health.service: shelfmark
      traefik.http.routers.shelfmark-health.middlewares: crowdsec-bouncer

      traefik.http.middlewares.shelfmark-chain.chain.middlewares: crowdsec-bouncer,authentik

      traefik.http.services.shelfmark.loadbalancer.server.port: 8084
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"
    volumes:
      - cwa-downloader_config:/config
      - ${ZFS_POOL_ROOT_HDD}/media/cwa-book-ingest:/cwa-book-ingest
      - ${ZFS_POOL_ROOT_HDD}/media/audiobooks:/audiobooks
      - ${ZFS_POOL_ROOT_HDD}/media/tordl/cwd-books:/data/tordl/cwd-books
      - ${ZFS_POOL_ROOT_HDD}/media/tordl/cwd-audiobooks:/data/tordl/cwd-audiobooks
      - ${ZFS_POOL_ROOT_HDD}/media/nzbdl/completed/Books:/data/nzbdl/completed/Books
      - ${ZFS_POOL_ROOT_HDD}/media/nzbdl/completed/Audiobooks:/data/nzbdl/completed/Audiobooks
    networks:
      - default
      - proxy
    
volumes:
  calibre-web-automated_config:
  cwa-downloader_config:

